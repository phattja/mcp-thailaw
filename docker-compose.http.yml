services:
  mcp-thailaw:
    stdin_open: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - "THAILAW_HTTP_PORT=${THAILAW_HTTP_PORT:-8005}"
      - "THAILAW_HTTP_HOST=0.0.0.0"
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-krisdika}
      - EMBEDDING_URL=${EMBEDDING_URL:-http://ai-tool:3003}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3-multi}
    ports:
      - "${THAILAW_HTTP_BIND_ADDRESS:-127.0.0.1}:${THAILAW_HTTP_PUBLISHED_PORT:-8005}:${THAILAW_HTTP_PORT:-8005}"
