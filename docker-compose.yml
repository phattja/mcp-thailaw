services:
  mcp-thailaw:
    build: .
    image: mcp-thailaw:latest
    container_name: mcp-thailaw
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - THAILAW_HTTP_PORT=${THAILAW_HTTP_PORT:-8005}
      - THAILAW_HTTP_HOST=0.0.0.0
      - QDRANT_URL=${QDRANT_URL:-http://host.docker.internal:6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-krisdika}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - EMBEDDING_URL=${EMBEDDING_URL:-http://host.docker.internal:3003/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
    ports:
      - "${THAILAW_HTTP_BIND_ADDRESS:-127.0.0.1}:${THAILAW_HTTP_PUBLISHED_PORT:-8005}:${THAILAW_HTTP_PORT:-8005}"
